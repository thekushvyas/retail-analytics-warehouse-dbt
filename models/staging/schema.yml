version: 2
models:
  - name: stg_transactions
    columns:
      - name: basket_id
        tests: [not_null]
      - name: household_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: sales_value
        tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: brand_type
        tests:
          - accepted_values:
              arguments:
                values: ['National', 'Private']
  - name: stg_households
    columns:
      - name: household_id
        tests: [unique, not_null]
